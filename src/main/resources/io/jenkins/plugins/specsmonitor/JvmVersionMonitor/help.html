<div>
    Shows the version of the Java virtual machine running on each node, for example
    <code>25.0.4.1</code>. Hover over the value to see the full version, for example
    <code>25.0.4.1+1-LTS</code>.
    <p>
        The information is read on the node itself, so it reports the JVM of the agent process.
    </p>
